{% load wagtailcore_tags %}
<section class="section">
  <div class="container-x max-w-3xl">
    {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
    {% if value.heading %}<h2 class="mt-3 text-3xl sm:text-4xl">{{ value.heading }}</h2>{% endif %}
    <div class="prose-brand mt-5">{{ value.body|richtext }}</div>
  </div>
</section>
