<section class="section">
  <div class="container-x">
    {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
    {% if value.heading %}<h2 class="mt-3 text-3xl sm:text-4xl">{{ value.heading }}</h2>{% endif %}
    <ol class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      {% for step in value.steps %}
      <li class="card relative p-6">
        <span class="font-serif text-3xl font-bold text-gold">{{ forloop.counter|stringformat:"02d" }}</span>
        <h3 class="mt-3 text-lg">{{ step.title }}</h3>
        {% if step.text %}<p class="mt-2 text-sm text-ink/70">{{ step.text }}</p>{% endif %}
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
