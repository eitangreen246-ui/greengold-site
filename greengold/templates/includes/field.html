{# Accessible field row. Usage: {% include "includes/field.html" with field=form.name %} #}
<div class="mb-4">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-ink">
    {{ field.label }}{% if field.field.required %}<span class="text-red-600" aria-hidden="true"> *</span><span class="sr-only"> (required)</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-ink/50">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-600" role="alert">{{ error }}</p>{% endfor %}
</div>
